<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio Wave → Spotify</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.6rem;
      }
      a.button,
      button {
        display: inline-block;
        background: #1db954;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 0.6rem 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      a.button:hover,
      button:hover {
        background: #1ed760;
      }
      input[type="date"] {
        padding: 0.5rem;
        font-size: 1rem;
        border-radius: 6px;
        border: 1px solid #888;
      }
      form {
        margin: 1.5rem 0;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      ul#progress {
        list-style: none;
        padding: 0;
      }
      ul#progress li {
        padding: 0.3rem 0;
        border-bottom: 1px solid rgba(128, 128, 128, 0.25);
        font-size: 0.95rem;
      }
      .muted {
        color: #888;
      }
      footer {
        margin-top: 3rem;
        font-size: 0.85rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>Radio Wave → Spotify</h1>
    {% block content %}{% endblock %}
    <footer>
      Creates a Spotify playlist from Český rozhlas Radio Wave's daily playlist.
    </footer>
  </body>
</html>
